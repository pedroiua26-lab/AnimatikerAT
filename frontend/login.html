<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Animatic Analyzer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="panel auth-panel">
        <h1>Login</h1>
        <label for="email">Email</label>
        <input id="email" type="email" />
        <label for="password">Password (6 digits)</label>
        <input id="password" type="password" maxlength="6" />
        <div class="auth-actions">
          <button id="loginButton" type="button">Login</button>
          <button id="registerButton" type="button">Register</button>
        </div>
        <div id="status" class="status info">Fill your email and password.</div>
      </section>
    </main>
    <script>
      const DEFAULT_API_BASE = window.ANIMATIC_API_BASE || "https://animatic-analyzer-api.onrender.com";
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const statusEl = document.getElementById("status");

      function getApiBase() {
        return (localStorage.getItem("animaticApiBase") || DEFAULT_API_BASE).replace(/\/$/, "");
      }

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`;
      }

      async function post(path, body) {
        const response = await fetch(`${getApiBase()}${path}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.detail || "Request failed");
        return payload;
      }

      document.getElementById("registerButton").onclick = async () => {
        try {
          await post("/register", { email: emailInput.value.trim() });
          setStatus("Registered. Check your email for verification link.", "success");
        } catch (error) {
          setStatus(error.message, "error");
        }
      };

      document.getElementById("loginButton").onclick = async () => {
        try {
          const payload = await post("/login", {
            email: emailInput.value.trim(),
            password: passwordInput.value.trim(),
          });
          localStorage.setItem("token", payload.access_token);
          setStatus("Login successful. Redirecting...", "success");
          window.location.href = "index.html";
        } catch (error) {
          setStatus(error.message, "error");
        }
      };
    </script>
  </body>
</html>
