<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Animatic Analyzer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="panel auth-panel">
        <h1>Login</h1>
        <label for="email">Email</label>
        <input id="email" type="email" />
        <label for="password">Password (6 digits)</label>
        <input id="password" type="password" maxlength="6" />
        <div class="auth-actions">
          <button id="loginButton" type="button">Login</button>
          <button id="registerButton" type="button">Register</button>
        </div>
        <div id="status" class="status info">Fill your email and password.</div>
      </section>
    </main>
    <script>
      const API_BASE = (window.ANIMATIC_API_BASE || "https://animatic-analyzer-api.onrender.com").replace(/\/$/, "");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const statusEl = document.getElementById("status");
      const loginButton = document.getElementById("loginButton");
      const registerButton = document.getElementById("registerButton");

      // Ping /health on page load to wake the server while the user types.
      fetch(`${API_BASE}/health`, { cache: "no-store" }).catch(() => null);

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`;
      }

      async function post(path, body) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000);
        try {
          const response = await fetch(`${API_BASE}${path}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            signal: controller.signal,
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.detail || "Request failed");
          return payload;
        } catch (err) {
          if (err.name === "AbortError" || err.message === "Failed to fetch") {
            throw new Error("Server unavailable. It may be starting up (can take ~30s on free tier) — please wait a moment and try again.");
          }
          throw err;
        } finally {
          clearTimeout(timeoutId);
        }
      }

      registerButton.onclick = async () => {
        const email = emailInput.value.trim();
        if (!email) {
          setStatus("Please enter your email.", "error");
          return;
        }
        registerButton.disabled = true;
        registerButton.textContent = "Registering...";
        setStatus("Sending verification email… this may take up to 30 seconds if the server is starting up.", "info");
        try {
          await post("/register", { email });
          setStatus("Check your email for the verification link.", "success");
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          registerButton.disabled = false;
          registerButton.textContent = "Register";
        }
      };

      loginButton.onclick = async () => {
        const email = emailInput.value.trim();
        if (!email) {
          setStatus("Please enter your email.", "error");
          return;
        }
        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";
        try {
          const payload = await post("/login", {
            email,
            password: passwordInput.value.trim(),
          });
          localStorage.setItem("token", payload.access_token);
          setStatus("Login successful. Redirecting...", "success");
          window.location.href = "index.html";
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = "Login";
        }
      };
    </script>
  </body>
</html>
