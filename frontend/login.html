<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Animatic Analyzer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="panel auth-panel">
        <h1>Login</h1>
        <label for="email">Email</label>
        <input id="email" type="email" />
        <label for="password">Password (6 digits)</label>
        <input id="password" type="password" maxlength="6" />
        <div class="auth-actions">
          <button id="loginButton" type="button">Login</button>
          <button id="registerButton" type="button">Register</button>
        </div>
        <div id="status" class="status info">Fill your email and password.</div>
      </section>
    </main>
    <script>
      const API_BASE = (window.ANIMATIC_API_BASE || "https://animatic-analyzer-api.onrender.com").replace(/\/$/, "");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const statusEl = document.getElementById("status");
      const loginButton = document.getElementById("loginButton");
      const registerButton = document.getElementById("registerButton");
      const ACCOUNT_REGISTRY_KEY = "animaticAccountRegistryV1";

      function readAccountRegistry() {
        try {
          const parsed = JSON.parse(localStorage.getItem(ACCOUNT_REGISTRY_KEY) || "{}");
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch {
          return {};
        }
      }

      function saveAccountRegistry(registry) {
        localStorage.setItem(ACCOUNT_REGISTRY_KEY, JSON.stringify(registry));
      }

      function registerAccountSnapshot(email, password = "") {
        if (!email) {
          return;
        }
        const registry = readAccountRegistry();
        registry[email] = {
          email,
          password,
          lastUpdatedAt: new Date().toISOString(),
        };
        saveAccountRegistry(registry);
      }

      (function preloadLastAccount() {
        const currentEmail = localStorage.getItem("animaticCurrentUserEmail") || "";
        if (!currentEmail) {
          return;
        }
        const registry = readAccountRegistry();
        const snapshot = registry[currentEmail];
        emailInput.value = currentEmail;
        if (snapshot?.password) {
          passwordInput.value = snapshot.password;
        }
      })();

      // Repeatedly ping /health while the user types so Render's free-tier
      // server wakes up before the actual request is sent.
      (function warmUp() {
        let tries = 0;
        function ping() {
          fetch(`${API_BASE}/health`, { cache: "no-store" }).catch(() => {
            if (++tries < 5) setTimeout(ping, 8000);
          });
        }
        ping();
      })();

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`;
      }

      async function post(path, body) {
        const MAX_ATTEMPTS = 2;
        const RETRY_DELAY_MS = 15000;
        for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 50000);
          try {
            const response = await fetch(`${API_BASE}${path}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
              signal: controller.signal,
            });
            clearTimeout(timeoutId);
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              const detail = payload.detail;
              const msg = Array.isArray(detail)
                ? detail.map(e => e.msg || String(e)).join("; ")
                : (typeof detail === "string" ? detail : "Request failed");
              throw new Error(msg);
            }
            return payload;
          } catch (err) {
            clearTimeout(timeoutId);
            const isNetworkErr = err.name === "AbortError" || err.message === "Failed to fetch";
            if (isNetworkErr && attempt < MAX_ATTEMPTS) {
              setStatus("Server starting up — retrying in 15s…", "info");
              await new Promise(r => setTimeout(r, RETRY_DELAY_MS));
              continue;
            }
            if (isNetworkErr) {
              throw new Error("Server unavailable. Please wait ~30s and try again.");
            }
            throw err;
          }
        }
      }

      registerButton.onclick = async () => {
        const email = emailInput.value.trim();
        if (!email) {
          setStatus("Please enter your email.", "error");
          return;
        }
        localStorage.setItem("animaticPendingEmail", email);
        registerAccountSnapshot(email);
        registerButton.disabled = true;
        registerButton.textContent = "Registering...";
        setStatus("Sending verification email… this may take up to 30 seconds if the server is starting up.", "info");
        try {
          const payload = await post("/register", { email });
          if (payload.verification_token) {
            setStatus(
              payload.email_sent
                ? "Verification link sent. Redirecting to setup..."
                : "Email delivery unavailable. Redirecting to setup...",
              "success"
            );
            setTimeout(() => {
              window.location.href = `verify.html?token=${encodeURIComponent(payload.verification_token)}`;
            }, 700);
          } else {
            setStatus("Registration started. Continue to verification.", "success");
          }
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          registerButton.disabled = false;
          registerButton.textContent = "Register";
        }
      };

      loginButton.onclick = async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        if (!email) {
          setStatus("Please enter your email.", "error");
          return;
        }
        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";
        try {
          const payload = await post("/login", {
            email,
            password,
          });
          localStorage.setItem("token", payload.access_token);
          localStorage.setItem("animaticCurrentUserEmail", email);
          registerAccountSnapshot(email, password);
          setStatus("Login successful. Redirecting...", "success");
          window.location.href = "index.html";
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = "Login";
        }
      };
    </script>
  </body>
</html>
