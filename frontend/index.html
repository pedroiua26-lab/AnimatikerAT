<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animatic Analyzer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Animatic Analyzer</h1>
      <p>Upload an animatic video and detect shot boundaries automatically.</p>

      <section class="panel">
        <label for="apiBaseUrl">Backend API URL</label>
        <input
          id="apiBaseUrl"
          type="url"
          placeholder="https://your-render-service.onrender.com"
        />

        <label for="videoFile">Animatic File</label>
        <input id="videoFile" type="file" accept="video/*" />
        <div id="videoPreview" class="video-preview" hidden>
          <p>Thumbnail (first second)</p>
          <img id="thumbnail" alt="Preview frame of the selected video" />
        </div>

        <video id="videoPlayer" controls style="width:100%; max-width:800px;"></video>

        <div id="timelineContainer">
          <div id="timeline">
            <div id="frameTicks"></div>
            <div id="playhead"></div>
            <div id="markers"></div>
          </div>
        </div>

        <div id="timelineControlsRow">
          <div id="frameDisplays">
            <div class="frame-display">
              <span class="label">Frame atual</span>
              <span id="currentFrameDisplay">0</span>
            </div>
            <div class="frame-display">
              <span class="label">Total de frames</span>
              <span id="totalFramesDisplay">0</span>
            </div>
            <div class="frame-display frame-display-fps">
              <span class="label">FPS</span>
              <span id="fpsDisplay">24.00</span>
            </div>
          </div>

          <div id="playheadControls">
            <button id="playheadBack" type="button">←</button>
            <button id="playheadForward" type="button">→</button>
          </div>

          <div id="zoomControls">
            <button id="zoomOut" type="button">- Zoom</button>
            <button id="zoomIn" type="button">+ Zoom</button>
          </div>
        </div>

        <div id="markerControls">
          <button id="addMarker" type="button">Add Marker</button>
          <button id="deleteMarker" type="button">Delete Marker</button>
          <button id="undoChange" type="button" disabled>Undo</button>
          <button id="redoChange" type="button" disabled>Redo</button>
        </div>

        <button id="saveChanges" type="button" disabled>Save Changes</button>
        <button id="analyzeButton" type="button">Analyze</button>
      </section>

      <section id="status" class="status"></section>

      <section class="panel">
        <h2>Detected Scenes</h2>
        <table id="resultsTable" hidden>
          <thead>
            <tr>
              <th>Scene #</th>
              <th>Start Frame</th>
              <th>End Frame</th>
              <th>Duration (Frames)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="exportControls" hidden>
          <button id="exportPdfButton" type="button">Export .pdf</button>
          <button id="exportXlsButton" type="button">Export .xls</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
