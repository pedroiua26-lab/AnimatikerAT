<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify | Animatic Analyzer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="panel auth-panel">
        <h1>Verify account</h1>
        <label for="apiBaseUrl">Backend API URL</label>
        <input id="apiBaseUrl" type="url" />
        <label for="password">Password (6 digits)</label>
        <input id="password" type="password" maxlength="6" />
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" maxlength="6" />
        <button id="verifyButton" type="button">Verify account</button>
        <div id="status" class="status info">Set your password to finish setup.</div>
      </section>
    </main>
    <script>
      const DEFAULT_API_BASE = window.ANIMATIC_API_BASE || "http://127.0.0.1:8000";
      const apiBaseInput = document.getElementById("apiBaseUrl");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const verifyButton = document.getElementById("verifyButton");
      const statusEl = document.getElementById("status");
      apiBaseInput.value = localStorage.getItem("animaticApiBase") || DEFAULT_API_BASE;

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`;
      }

      function setError(message) {
        setStatus(message, "error");
      }

      verifyButton.onclick = async () => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        if (!token) {
          setError("Verification token is missing.");
          return;
        }

        if (passwordInput.value !== confirmPasswordInput.value) {
          setError("Passwords do not match.");
          return;
        }

        verifyButton.disabled = true;
        verifyButton.textContent = "Verifying...";
        setStatus("Verifying account...", "info");

        let timeoutId = null;
        try {
          const apiBase = apiBaseInput.value.trim().replace(/\/$/, "");
          localStorage.setItem("animaticApiBase", apiBase);
          const url = `${apiBase}/verify`;
          const body = {
            token,
            password: passwordInput.value.trim(),
          };
          console.log("VERIFY REQUEST:", url, body);

          const controller = new AbortController();
          timeoutId = setTimeout(() => controller.abort(), 10000);

          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            signal: controller.signal,
          });
          clearTimeout(timeoutId);
          timeoutId = null;

          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.detail || "Verification failed");
          setStatus("Verification complete. Redirecting to login...", "success");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 800);
        } catch (err) {
          console.error("VERIFY ERROR:", err);
          setError(err.message || "Verify failed");
        } finally {
          if (typeof timeoutId !== "undefined" && timeoutId !== null) {
            clearTimeout(timeoutId);
          }
          verifyButton.disabled = false;
          verifyButton.textContent = "Verify account";
        }
      };
    </script>
  </body>
</html>
