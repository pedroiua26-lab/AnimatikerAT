<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify | Animatic Analyzer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="panel auth-panel">
        <h1>Verify account</h1>
        <label for="password">Password (6 digits)</label>
        <input id="password" type="password" maxlength="6" />
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" maxlength="6" />
        <button id="verifyButton" type="button">Verify account</button>
        <div id="status" class="status info">Set your password to finish setup.</div>
      </section>
    </main>
    <script>
      const API_BASE = (window.ANIMATIC_API_BASE || "https://animatic-analyzer-api.onrender.com").replace(/\/$/, "");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const verifyButton = document.getElementById("verifyButton");
      const statusEl = document.getElementById("status");

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`;
      }

      verifyButton.onclick = async () => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        if (!token) {
          setStatus("Verification token is missing.", "error");
          return;
        }

        if (passwordInput.value !== confirmPasswordInput.value) {
          setStatus("Passwords do not match.", "error");
          return;
        }

        verifyButton.disabled = true;
        verifyButton.textContent = "Verifying...";
        setStatus("Verifying account… this may take up to 30 seconds if the server is starting up.", "info");

        try {
          const response = await fetch(`${API_BASE}/verify`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password: passwordInput.value }),
          });

          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload.detail || "Verification failed");
          }

          setStatus("Verification complete. Redirecting to login...", "success");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        } catch (err) {
          const message = err.name === "AbortError"
            ? "Request timed out. The server may be starting up — please try again in a moment."
            : (err.message || "Failed to verify. Please try again.");
          setStatus(message, "error");
        } finally {
          verifyButton.disabled = false;
          verifyButton.textContent = "Verify account";
        }
      };
    </script>
  </body>
</html>
