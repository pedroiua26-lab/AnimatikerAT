<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify | Animatic Analyzer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="panel auth-panel">
        <h1>Verify account</h1>
        <label for="password">Password (6 numbers only)</label>
        <input id="password" type="password" maxlength="6" inputmode="numeric" />
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" maxlength="6" inputmode="numeric" />
        <button id="verifyButton" type="button">Verify account</button>
        <div id="status" class="status info">Set your 6-digit password to finish setup.</div>
      </section>
    </main>
    <script>
      const API_BASE = (window.ANIMATIC_API_BASE || "https://animatic-analyzer-api.onrender.com").replace(/\/$/, "");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const verifyButton = document.getElementById("verifyButton");
      const statusEl = document.getElementById("status");
      const ACCOUNT_REGISTRY_KEY = "animaticAccountRegistryV1";

      function readAccountRegistry() {
        try {
          const parsed = JSON.parse(localStorage.getItem(ACCOUNT_REGISTRY_KEY) || "{}");
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch {
          return {};
        }
      }

      function saveAccountRegistry(registry) {
        localStorage.setItem(ACCOUNT_REGISTRY_KEY, JSON.stringify(registry));
      }

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`;
      }

      // Repeatedly ping /health while the user fills the form so Render's
      // free-tier server wakes up before the verify request is sent.
      (function warmUp() {
        let tries = 0;
        function ping() {
          fetch(`${API_BASE}/health`, { cache: "no-store" }).catch(() => {
            if (++tries < 5) setTimeout(ping, 8000);
          });
        }
        ping();
      })();

      verifyButton.onclick = async () => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        if (!token) {
          setStatus("Verification token is missing.", "error");
          return;
        }
        if (passwordInput.value !== confirmPasswordInput.value) {
          setStatus("Passwords do not match.", "error");
          return;
        }
        if (!/^[0-9]{6}$/.test(passwordInput.value)) {
          setStatus("Password must be exactly 6 digits (numbers only).", "error");
          return;
        }

        verifyButton.disabled = true;
        verifyButton.textContent = "Verifying...";

        const MAX_ATTEMPTS = 3;
        const RETRY_DELAY_SECS = 15;

        for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
          setStatus(
            attempt === 1
              ? "Verifying… may take up to 30s if the server is starting up."
              : `Server starting up — retrying (${attempt}/${MAX_ATTEMPTS})…`,
            "info"
          );

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 50000);

          try {
            const response = await fetch(`${API_BASE}/verify`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, password: passwordInput.value }),
              signal: controller.signal,
            });
            clearTimeout(timeoutId);

            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.detail || "Verification failed");

            const pendingEmail = localStorage.getItem("animaticPendingEmail") || "";
            if (pendingEmail) {
              const registry = readAccountRegistry();
              registry[pendingEmail] = {
                email: pendingEmail,
                password: passwordInput.value,
                lastUpdatedAt: new Date().toISOString(),
              };
              saveAccountRegistry(registry);
              localStorage.removeItem("animaticPendingEmail");
            }

            setStatus("Verification complete. Redirecting to login...", "success");
            setTimeout(() => { window.location.href = "login.html"; }, 1200);
            return;
          } catch (err) {
            clearTimeout(timeoutId);
            const isNetworkErr = err.name === "AbortError" || err.message === "Failed to fetch";

            if (isNetworkErr && attempt < MAX_ATTEMPTS) {
              await new Promise(resolve => {
                let secs = RETRY_DELAY_SECS;
                const tick = setInterval(() => {
                  secs--;
                  setStatus(`Server starting up — retrying in ${secs}s…`, "info");
                  if (secs <= 0) { clearInterval(tick); resolve(); }
                }, 1000);
              });
              continue;
            }

            setStatus(
              isNetworkErr
                ? "Server unavailable after multiple attempts. Please wait a minute and try again."
                : (err.message || "Failed to verify. Please try again."),
              "error"
            );
            break;
          }
        }

        verifyButton.disabled = false;
        verifyButton.textContent = "Verify account";
      };
    </script>
  </body>
</html>
